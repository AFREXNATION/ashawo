<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ashawo.ng</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --card: #242424;
    --accent: #e63946;
    --accent2: #ff6b81;
    --text: #f1f1f1;
    --muted: #888;
    --border: #333;
    --green: #2ecc71;
    --yellow: #f39c12;
    --radius: 12px;
    --font: 'Segoe UI', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .header-right { display:flex; gap:10px; align-items:center; }
  .orders-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    cursor: pointer;
    display: flex; align-items:center; gap:5px;
  }
  .orders-btn:active { opacity:.7; }
  .badge {
    background: var(--accent);
    color:#fff;
    border-radius:50%;
    width:18px; height:18px;
    font-size:0.65rem;
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
  }

  /* ── Nav Tabs ── */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    flex-shrink: 0;
    padding: 12px 18px;
    font-size: 0.82rem;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: all .2s;
    white-space: nowrap;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight:600; }

  /* ── Page ── */
  .page { display:none; padding:16px; }
  .page.active { display:block; }

  /* ── States Grid ── */
  .states-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 4px;
  }
  .state-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 14px;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    overflow: hidden;
  }
  .state-card::before {
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height: 3px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .2s;
  }
  .state-card:active, .state-card:hover { border-color: var(--accent); }
  .state-card:hover::before { transform: scaleX(1); }
  .state-name { font-weight: 700; font-size: 1rem; }
  .state-count { font-size: 0.75rem; color: var(--muted); }
  .state-price { font-size: 0.78rem; color: var(--accent2); font-weight: 600; margin-top:4px; }

  /* ── Section header ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title { font-size: 1.1rem; font-weight: 700; }
  .back-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .back-btn:active { opacity:.7; }

  /* ── Girls List ── */
  .girls-list { display:flex; flex-direction:column; gap:12px; }
  .girl-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .girl-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items:center; justify-content:center;
    font-size: 1.8rem;
    border: 2px solid var(--accent);
  }
  .girl-info { flex:1; min-width:0; }
  .girl-name { font-weight: 700; font-size: 1rem; }
  .girl-desc { font-size: 0.75rem; color: var(--muted); margin: 3px 0; }
  .girl-tags { display:flex; flex-wrap:wrap; gap:4px; margin: 5px 0; }
  .tag {
    background: #2a2a2a;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 0.65rem;
    color: var(--muted);
  }
  .girl-price { font-size: 0.95rem; font-weight:700; color: var(--accent); }
  .girl-rating { font-size:0.73rem; color: var(--yellow); }
  .book-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    width: 100%;
    transition: background .2s;
  }
  .book-btn:active { background: #c0303c; }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    z-index: 200;
    align-items: flex-end;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background: var(--surface);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 24px 18px 32px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp .3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }
  .modal-girl-row {
    display:flex; gap:12px; align-items:center;
    background: var(--card);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 16px;
  }
  .modal-avatar { font-size:2rem; }
  .modal-girl-name { font-weight:700; }
  .modal-girl-price { color:var(--accent); font-size:0.9rem; font-weight:600; }

  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; display:block; }
  .form-input, .form-select {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 13px;
    font-size: 0.9rem;
    font-family: var(--font);
    outline: none;
    transition: border .2s;
  }
  .form-input:focus, .form-select:focus { border-color: var(--accent); }
  .form-select option { background: var(--surface); }

  .confirm-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: background .2s;
  }
  .confirm-btn:active { background: #c0303c; }
  .cancel-btn-sm {
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 8px;
  }
  .cancel-btn-sm:active { opacity:.7; }

  /* ── Orders Page ── */
  .orders-list { display:flex; flex-direction:column; gap:12px; }
  .order-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .order-top {
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom: 10px;
  }
  .order-name { font-weight:700; font-size:0.95rem; }
  .order-id { font-size:0.68rem; color:var(--muted); }
  .status-pill {
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.7rem;
    font-weight: 700;
    flex-shrink:0;
  }
  .status-pending  { background:#3a2a00; color: var(--yellow); }
  .status-active   { background:#0d2a1a; color: var(--green); }
  .status-arriving { background:#1a1a3a; color:#7ec8e3; }
  .status-done     { background:#1a1a1a; color: var(--muted); }
  .status-cancelled{ background:#2a0d0d; color:#e06060; }

  .order-details { font-size:0.78rem; color:var(--muted); line-height:1.6; }
  .order-price { font-size:0.95rem; color:var(--accent); font-weight:700; margin-top:6px; }

  /* ── Tracker ── */
  .tracker-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 12px 0;
    position: relative;
  }
  .tracker-line {
    position:absolute;
    top:50%; left:12px; right:12px;
    height: 2px;
    background: var(--border);
    z-index:0;
    transform: translateY(-50%);
  }
  .tracker-line-fill {
    position:absolute;
    top:50%; left:12px;
    height: 2px;
    background: var(--green);
    z-index:1;
    transform: translateY(-50%);
    transition: width .4s;
  }
  .tracker-step {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--border);
    border: 2px solid var(--border);
    z-index:2;
    display:flex; align-items:center; justify-content:center;
    font-size:0.6rem;
    font-weight:700;
    flex-shrink:0;
  }
  .tracker-step.done { background:var(--green); border-color:var(--green); color:#fff; }
  .tracker-step.current { background:var(--accent); border-color:var(--accent); color:#fff; animation: pulse 1s infinite; }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 0 0 rgba(230,57,70,.4); }
    50%      { box-shadow:0 0 0 6px rgba(230,57,70,0); }
  }
  .tracker-labels {
    display:flex; justify-content:space-between;
    font-size: 0.6rem; color: var(--muted); margin-top:4px;
    padding: 0 2px;
  }

  .cancel-order-btn {
    width:100%;
    background:transparent;
    color:#e06060;
    border:1px solid #3a1515;
    border-radius:8px;
    padding:9px;
    font-size:0.8rem;
    cursor:pointer;
    margin-top:10px;
  }
  .cancel-order-btn:active { background:#2a0d0d; }

  /* ── Empty State ── */
  .empty {
    text-align:center;
    padding: 50px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size:3rem; margin-bottom:12px; }
  .empty-text { font-size:0.9rem; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 90px; left:50%; transform: translateX(-50%);
    background: #333;
    color:#fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 0.82rem;
    z-index:999;
    white-space:nowrap;
    opacity:0;
    transition: opacity .3s;
    pointer-events:none;
  }
  .toast.show { opacity:1; }

  /* ── Bottom Nav ── */
  .bottom-nav {
    position:fixed; bottom:0; left:0; right:0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display:flex;
    z-index:100;
  }
  .nav-item {
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 10px 0;
    cursor:pointer;
    color: var(--muted);
    font-size:0.65rem;
    gap:3px;
    transition: color .2s;
  }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size:1.3rem; }

  /* ── Confirm Dialog ── */
  .confirm-dialog {
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,.85);
    z-index:300;
    align-items:center; justify-content:center;
    padding: 20px;
  }
  .confirm-dialog.open { display:flex; }
  .confirm-box {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    width:100%;
    max-width: 340px;
    text-align:center;
    animation: popIn .2s ease;
  }
  @keyframes popIn {
    from { transform:scale(.85); opacity:0; }
    to   { transform:scale(1); opacity:1; }
  }
  .confirm-icon { font-size:2.5rem; margin-bottom:10px; }
  .confirm-title { font-weight:700; font-size:1rem; margin-bottom:6px; }
  .confirm-msg { font-size:0.82rem; color:var(--muted); margin-bottom:20px; }
  .confirm-actions { display:flex; gap:10px; }
  .btn-yes {
    flex:1; background:var(--accent); color:#fff;
    border:none; border-radius:8px; padding:12px;
    font-size:0.9rem; font-weight:700; cursor:pointer;
  }
  .btn-no {
    flex:1; background:var(--card); color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:12px;
    font-size:0.9rem; cursor:pointer;
  }

  /* ── Page title ── */
  .page-title { font-size:1rem; font-weight:700; margin-bottom:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .highlight { color:var(--text); }

  /* ── Status dots ── */
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .dot-green { background:var(--green); }
  .dot-yellow { background:var(--yellow); }
  .dot-grey { background:var(--muted); }

  @media(min-width:480px){
    .states-grid { grid-template-columns: repeat(3,1fr); }
    .modal { max-width:480px; margin:0 auto; border-radius:var(--radius); margin-bottom:0; }
    .modal-overlay { align-items:center; justify-content:center; }
  }
</style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo">Ash<span>awo</span>.ng</div>
  <div class="header-right">
    <button class="orders-btn" onclick="switchTab('orders')">

<!-- ═══════════════ STATES PAGE ═══════════════ -->
<div class="page active" id="page-states">

      <label class="form-label">Duration</label>
      <select class="form-select" id="durationSelect">

        <option value="3hrs">3 Hours (Best Value)</option>

        <span style="color:var(--muted)">Base price</span><span id="basePrice">₦0</span>

<!-- ═══════════════ CONFIRM DIALOG ═══════════════ -->
<div class="confirm-dialog" id="confirmDialog">
  <div class="confirm-box">

<!-- ═══════════════ TOAST ═══════════════ -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════
const STATES = [

const GIRL_TEMPLATES = [
  { name:'Chioma',  emoji:'👩🏿',  tags:['Slim','Long hair','Night owl'],   rating:4.9, multiplier:1.3 },
  { name:'Blessing',emoji:'👩🏾',  tags:['Curvy','Discreet','GFE'],         rating:4.7, multiplier:1.0 },

  { name:'Priscilla',emoji:'👩🏾‍🦱',tags:['Tall','Sporty','Open mind'],      rating:4.6, multiplier:1.0 },

const DURATION_MAP = {
  '1hr':      { label:'1 Hour',    mult:1   },
  '2hrs':     { label:'2 Hours',   mult:1.8 },
  '3hrs':     { label:'3 Hours',   mult:2.4 },

};

const TRACK_STEPS = ['Confirmed','Preparing','On the Way','Arriving','Arrived ✅'];

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let currentState = null;
let bookingTarget = null;   // { girl, state }
let orders = loadOrders();
let dialogCallback = null;

// ═══════════════════════════════════════════════
//  LOCAL STORAGE
// ═══════════════════════════════════════════════
function loadOrders() {
  try { return JSON.parse(localStorage.getItem('ashawo_orders') || '[]'); }
  catch(e) { return []; }
}
function saveOrders() {
  localStorage.setItem('ashawo_orders', JSON.stringify(orders));
}

// ═══════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  const navEl = document.getElementById('nav-' + tab);
  if(navEl) navEl.classList.add('active');
  if(tab === 'orders') renderOrders();
  updateBadge();
}

// ═══════════════════════════════════════════════
//  RENDER STATES
// ═══════════════════════════════════════════════
function renderStates() {
  const grid = document.getElementById('statesGrid');
  grid.innerHTML = STATES.map(s => `
    <div class="state-card" onclick="openState('${s.id}')">
      <div style="font-size:1.6rem">${s.emoji}</div>
      <div class="state-name">${s.name}</div>
      <div class="state-count"><span class="dot dot-green"></span>${s.count} available</div>
      <div class="state-price">From ₦${s.base.toLocaleString()}</div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════
//  OPEN STATE
// ═══════════════════════════════════════════════
function openState(stateId) {
  currentState = STATES.find(s => s.id === stateId);
  document.getElementById('browseStateTitle').textContent = currentState.name;
  renderGirls();
  switchTab('browse');
}

function renderGirls() {
  const list = document.getElementById('girlsList');
  const girls = getGirlsForState(currentState);
  list.innerHTML = girls.map((g,i) => `
    <div class="girl-card">
      <div class="girl-avatar" style="background:${avatarBg(i)}">${g.emoji}</div>
      <div class="girl-info">
        <div class="girl-name">${g.name}</div>
        <div class="girl-rating">⭐ ${g.rating} · ${currentState.name}</div>
        <div class="girl-tags">${g.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="girl-price">₦${Math.round(currentState.base * g.multiplier).toLocaleString()}<span style="color:var(--muted);font-size:.7rem;font-weight:400">/hr</span></div>
        <button class="book-btn" onclick="openBooking('${currentState.id}', ${i})">📍 Book Now</button>
      </div>
    </div>
  `).join('');
}

function avatarBg(i) {
  const cols = ['#2a0d0d','#1a0d2a','#0d1a2a','#0d2a0d','#2a1a0d'];
  return cols[i % cols.length];
}

function getGirlsForState(state) {
  // Deterministic shuffle per state so each state has different order
  const seed = state.id.charCodeAt(0);
  return [...GIRL_TEMPLATES]
    .map((g, i) => ({ ...g, _sort: (i * seed * 7) % GIRL_TEMPLATES.length }))
    .sort((a,b) => a._sort - b._sort)
    .slice(0, 5 + (seed % 3));
}

// ═══════════════════════════════════════════════
//  BOOKING MODAL
// ═══════════════════════════════════════════════
function openBooking(stateId, girlIdx) {
  const state = STATES.find(s => s.id === stateId);
  const girl  = getGirlsForState(state)[girlIdx];
  bookingTarget = { girl, state };

  document.getElementById('modalAvatar').textContent = girl.emoji;
  document.getElementById('modalName').textContent   = girl.name;
  document.getElementById('modalState').textContent  = '📍 ' + state.name;
  document.getElementById('addressInput').value      = '';
  document.getElementById('durationSelect').value    = '1hr';
  updatePricing();

  document.getElementById('bookModal').classList.add('open');
}

function closeModal() {
  document.getElementById('bookModal').classList.remove('open');
  bookingTarget = null;
}

function updatePricing() {
  if(!bookingTarget) return;
  const dur    = document.getElementById('durationSelect').value;
  const info   = DURATION_MAP[dur];
  const base   = Math.round(bookingTarget.state.base * bookingTarget.girl.multiplier);
  const total  = Math.round(base * info.mult);
  document.getElementById('modalPrice').textContent = '₦' + base.toLocaleString() + '/hr';
  document.getElementById('basePrice').textContent  = '₦' + base.toLocaleString();
  document.getElementById('durMult').textContent    = '×' + info.mult;
  document.getElementById('totalPrice').textContent = '₦' + total.toLocaleString();
}
document.getElementById('durationSelect').addEventListener('change', updatePricing);

function confirmBooking() {
  const address  = document.getElementById('addressInput').value.trim();
  const duration = document.getElementById('durationSelect').value;
  if(!address) { showToast('⚠️ Please enter your address'); return; }

  const dur   = DURATION_MAP[duration];
  const base  = Math.round(bookingTarget.state.base * bookingTarget.girl.multiplier);
  const total = Math.round(base * dur.mult);

  showDialog(
    '✅','Confirm Booking',
    `Book ${bookingTarget.girl.name} in ${bookingTarget.state.name} for ${dur.label}?\nTotal: ₦${total.toLocaleString()}`,
    () => placeOrder(address, duration, base, total)
  );
}

function placeOrder(address, duration, base, total) {
  const dur = DURATION_MAP[duration];
  const id  = 'ORD' + Date.now().toString(36).toUpperCase();
  const order = {
    id,
    girlName:  bookingTarget.girl.name,
    girlEmoji: bookingTarget.girl.emoji,
    stateName: bookingTarget.state.name,
    stateId:   bookingTarget.state.id,
    address,
    duration:  dur.label,
    total,
    step: 0,   // 0=Confirmed … 4=Arrived
    placedAt: Date.now(),
    status: 'active',
  };
  orders.unshift(order);
  saveOrders();
  closeModal();
  updateBadge();
  showToast('🎉 Order placed! Tracking now...');
  simulateTracking(order.id);
  setTimeout(() => switchTab('orders'), 500);
}

// ═══════════════════════════════════════════════
//  RENDER ORDERS
// ═══════════════════════════════════════════════
function renderOrders() {
  const list = document.getElementById('ordersList');
  if(!orders.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No orders yet.<br>Select a state and book a companion!</div></div>`;
    return;
  }

  list.innerHTML = orders.map(o => {
    const stepW  = o.step >= TRACK_STEPS.length - 1 ? '100%' : Math.round(o.step / (TRACK_STEPS.length-1) * 100) + '%';
    const steps  = TRACK_STEPS.map((s,i) => {
      let cls = '';
      if(i < o.step) cls = 'done';
      else if(i === o.step && o.status === 'active') cls = 'current';
      return `<div class="tracker-step ${cls}">${i < o.step ? '✓' : i+1}</div>`;
    }).join('');

    const isCancelled = o.status === 'cancelled';
    const isDone      = o.step >= TRACK_STEPS.length - 1;
    const statusLabel = isCancelled ? 'Cancelled'
                      : isDone      ? 'Arrived'
                      : o.step >= 2 ? 'On the Way'
                      : 'Confirmed';
    const statusClass = isCancelled ? 'status-cancelled'
                      : isDone      ? 'status-done'
                      : o.step >= 2 ? 'status-arriving'
                      : 'status-active';

    return `
    <div class="order-card" id="ocard-${o.id}">
      <div class="order-top">
        <div>
          <div class="order-name">${o.girlEmoji} ${o.girlName}</div>
          <div class="order-id">#${o.id} · ${o.stateName}</div>
        </div>
        <div class="status-pill ${statusClass}">${statusLabel}</div>
      </div>
      <div class="order-details">
        📍 ${o.address}<br>
        ⏱ ${o.duration} · Placed ${timeAgo(o.placedAt)}
      </div>
      <div class="order-price">₦${o.total.toLocaleString()}</div>

      ${!isCancelled ? `
      <div style="margin-top:12px;">
        <div style="font-size:.7rem;color:var(--muted);margin-bottom:4px;">TRACKING</div>
        <div class="tracker-bar" style="position:relative;">
          <div class="tracker-line"></div>
          <div class="tracker-line-fill" style="width:${stepW}"></div>
          ${steps}
        </div>
        <div class="tracker-labels">${TRACK_STEPS.map(s=>`<span>${s.split(' ')[0]}</span>`).join('')}</div>
        <div style="font-size:.75rem;color:var(--accent);margin-top:6px;font-weight:600;">
          ${isDone ? '✅ She has arrived!' : '📡 ' + TRACK_STEPS[o.step]}
        </div>
      </div>
      ` : ''}

      ${!isCancelled && !isDone ? `
        <button class="cancel-order-btn" onclick="cancelOrder('${o.id}')">✖ Cancel Order</button>
      ` : ''}
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════
//  SIMULATE TRACKING
// ═══════════════════════════════════════════════
function simulateTracking(orderId) {
  const delays = [0, 8000, 20000, 35000, 55000]; // ms after placement
  delays.forEach((delay, step) => {
    setTimeout(() => {
      const o = orders.find(x => x.id === orderId);
      if(!o || o.status === 'cancelled') return;
      o.step = step;
      saveOrders();
      updateBadge();
      const pg = document.getElementById('page-orders');
      if(pg && pg.classList.contains('active')) renderOrders();
    }, delay);
  });
}

// ═══════════════════════════════════════════════
//  CANCEL ORDER
// ═══════════════════════════════════════════════
function cancelOrder(orderId) {
  const o = orders.find(x => x.id === orderId);
  if(!o) return;
  showDialog(
    '⚠️','Cancel Order',
    `Cancel your booking for ${o.girlName}? This cannot be undone.`,
    () => {
      o.status = 'cancelled';
      saveOrders();
      renderOrders();
      updateBadge();
      showToast('Order cancelled.');
    }
  );
}

// ═══════════════════════════════════════════════
//  BADGE
// ═══════════════════════════════════════════════
function updateBadge() {
  const active = orders.filter(o => o.status === 'active' && o.step < TRACK_STEPS.length - 1).length;
  document.getElementById('orderBadge').textContent = active;
  document.getElementById('orderBadge').style.display = active ? 'flex' : 'none';
}

// ═══════════════════════════════════════════════
//  CONFIRM DIALOG
// ═══════════════════════════════════════════════
function showDialog(icon, title, msg, cb) {
  document.getElementById('dialogIcon').textContent  = icon;
  document.getElementById('dialogTitle').textContent = title;
  document.getElementById('dialogMsg').textContent   = msg;
  document.getElementById('dialogYesBtn').onclick    = () => { closeDialog(); cb(); };
  document.getElementById('confirmDialog').classList.add('open');
}
function closeDialog() {
  document.getElementById('confirmDialog').classList.remove('open');
}

// ═══════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function timeAgo(ts) {
  const s = Math.round((Date.now() - ts) / 1000);
  if(s < 60)  return 'just now';
  if(s < 3600) return Math.round(s/60) + 'm ago';
  return Math.round(s/3600) + 'h ago';
}

// Close modal on overlay click
document.getElementById('bookModal').addEventListener('click', function(e) {
  if(e.target === this) closeModal();
});
document.getElementById('confirmDialog').addEventListener('click', function(e) {
  if(e.target === this) closeDialog();
});

// ═══════════════════════════════════════════════
//  RESUME ACTIVE TRACKING on page load
// ═══════════════════════════════════════════════
function resumeTracking() {
  orders.forEach(o => {
    if(o.status !== 'active' || o.step >= TRACK_STEPS.length - 1) return;
    const elapsed = Date.now() - o.placedAt;
    const delays  = [0, 8000, 20000, 35000, 55000];
    delays.forEach((delay, step) => {
      const remaining = delay - elapsed;
      if(remaining > 0) {
        setTimeout(() => {
          const fresh = orders.find(x => x.id === o.id);
          if(!fresh || fresh.status === 'cancelled') return;
          fresh.step = step;
          saveOrders();
          updateBadge();
          const pg = document.getElementById('page-orders');
          if(pg && pg.classList.contains('active')) renderOrders();
        }, remaining);
      } else if(step > o.step) {
        // catch up missed steps immediately
        o.step = step;
      }
    });
    saveOrders();
  });
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
renderStates();
resumeTracking();
updateBadge();
</script>
</body>
</html>
